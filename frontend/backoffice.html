<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Second Vite entry point, and the reason it exists: iOS Safari reads the
      manifest of the document that is loaded when you tap "Add to Home
      Screen", and it does not reliably pick up a <link rel="manifest"> whose
      href was swapped client-side after load. A Back Office shortcut added
      from the shared index.html therefore inherited the POS manifest and
      launched at "/" — which App.jsx's catch-all sends to Order Entry.

      This file hard-codes the Back Office manifest, so there is nothing to
      swap and nothing for Safari to miss. It is served for /backoffice* by
      the rewrite rules in public/_redirects (and by the dev/preview
      middleware in vite.config.js, so local behaviour matches production).
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/backoffice.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-title" content="Back Office" />
    <!--
      Locked at 1× so Back Office behaves like an app rather than a web page:
      no pinch zoom, no double-tap zoom, no accidental half-zoomed state to get
      stuck in one-handed mid-shift.

      Only this entry is touched. Order Entry and the KDS load index.html, which
      keeps its own zoomable viewport — the two have been separate documents
      since backoffice.html was added, so there's nothing shared to break.

      Scope of what this actually achieves: honoured in the Home Screen
      (standalone) app and on Android. In-browser iOS Safari has ignored
      user-scalable=no since iOS 10 as an accessibility guarantee, so pinch may
      still work there; the touch-action rule below is what reliably kills
      double-tap zoom on every iOS surface. Desktop zoom (Ctrl +/-) is
      unaffected by any of this.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <style>
      /* Kills double-tap-to-zoom (and its 300ms tap delay) for everything this
         document renders — including the Back Office login screen, which mounts
         outside the .backoffice wrapper, so a class-scoped rule would miss it.
         Lives here rather than in index.css because that stylesheet is shared
         with Order Entry and the KDS. */
      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
    <meta name="description" content="Narcos Tacos — Reports, Staff, Menu & Payroll" />
    <title>Narcos Back Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

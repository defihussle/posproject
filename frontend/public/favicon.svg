<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Narcos Tacos POS</title>
  <!-- Chili pepper on the app's dark tile. Vector, so the browser tab icon is
       resolution-independent; the PNG/ICO siblings in this folder are rendered
       from the same artwork for platforms that can't take an SVG.
       Master (transparent, unframed): frontend/src/assets/chili-pepper.svg -->
  <rect width="48" height="48" fill="#111111"/>
  <!-- Fits the pepper's bounding box into the tile with a 6% margin, matching
       the framing the PNG generator uses so every size looks identical. -->
  <g transform="translate(-3.5,-2.25) scale(1.128)">
    <path fill="#E13038" d="M10.2 41.9
      C13.5 38.5 17.0 34.8 19.6 31.0
      C21.0 28.0 21.2 23.5 22.4 20.4
      C24.5 16.8 33.0 15.8 36.6 19.2
      C38.6 21.5 38.0 25.5 36.0 29.5
      C34.0 33.5 31.0 36.5 27.6 38.4
      C22.5 40.2 15.5 41.5 10.2 41.9 Z"/>
    <path fill="#3C7A51" d="M30.5 13.2
      C32.2 14.1 33.8 15.5 33.8 16.6
      C33.8 17.7 32.3 18.6 30.6 18.9
      C28.8 18.6 27.2 17.7 27.2 16.6
      C27.2 15.5 28.8 14.1 30.5 13.2 Z"/>
    <path fill="none" stroke="#3C7A51" stroke-width="1.7" stroke-linecap="round"
          d="M30.4 13.8 C30.7 10.5 29.9 7.6 29.0 5.4"/>
  </g>
</svg>
